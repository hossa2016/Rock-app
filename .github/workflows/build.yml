n>\", extra + \"</application>\", 1)\nopen(manifest_path, \"w\", encoding=\"utf-8\").write(m)\n\nfor path in glob.glob(\"_app/android/app/src/main/**/MainActivity.kt\", recursive=True):\n    src = open(path, encoding=\"utf-8\").read()\n    pkg = re.search(r\"^package\\s+[\\w.]+\", src, re.M).group(0)\n    open(path, \"w\", encoding=\"utf-8\").write(\n        pkg + \"\\n\\n\"\n        \"import com.ryanheise.audioservice.AudioServiceActivity\\n\\n\"\n        \"class MainActivity : AudioServiceActivity()\\n\"\n    )\nEOF\n"},{"name":"Compilar APK","working-directory":"_app","run":"flutter pub get\nflutter build apk --release\n"},{"name":"Publicar APK","uses":"softprops/action-gh-release@v2","with":{"tag_name":"build-${{ github.run_number }}","name":"Build ${{ github.run_number }}","files":"_app/build/app/outputs/flutter-apk/app-release.apk"}}]}}}
